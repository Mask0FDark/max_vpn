name: Android 7 device smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/app/src/androidTest/**"
      - ".github/workflows/android-device-tests.yml"

jobs:
  android7:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            gradle :android:app:connectedDebugAndroidTest --no-daemon
            adb shell am start -W -n ru.vgastream.maxvpn/.MainActivity
            sleep 4
            adb shell pidof ru.vgastream.maxvpn
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              echo 'ANDROID_RUNTIME_CRASH'
              exit 1
            fi
            echo 'ANDROID7_EMULATOR_LAUNCH_AND_JNI_PASS'
