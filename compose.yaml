services:
  maxvpn-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maxvpn-web
    restart: unless-stopped
    init: true
    environment:
      MAXVPN_RELAY_TOKEN: ${MAXVPN_RELAY_TOKEN:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "127.0.0.1:18764:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    pids_limit: 128
