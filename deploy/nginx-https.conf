server {
    listen 80;
    listen [::]:80;
    server_name max-vpn.mask-0f-darkness.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/maxvpn-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name max-vpn.mask-0f-darkness.ru;
    ssl_certificate /etc/letsencrypt/live/max-vpn.mask-0f-darkness.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-vpn.mask-0f-darkness.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:18764;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
